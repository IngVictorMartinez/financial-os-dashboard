<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial OS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>💰 Financial OS</h1>
        <p>Dashboard Financiero Personal</p>
    </header>

    <main class="container">

        <section class="cards">

            <div class="card expense">
                <h3>💸 Gastos del mes</h3>
                <p id="monthly-expense">$0</p>
            </div>

            <div class="card income">
                <h3>📈 Ingresos del mes</h3>
                <p id="monthly-income">$0</p>
            </div>

            <div class="card movements">
                <h3>📊 Movimientos</h3>
                <p id="total-movements">0</p>
            </div>

        </section>

        <section class="transactions">

            <h2>Movimientos</h2>

            <table>
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Monto</th>
                        <th>Cuenta</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Tipo</th>
                    </tr>
                </thead>

                <tbody id="transactions-table"></tbody>

            </table>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
