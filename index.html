<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Financial OS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>💰 Financial OS</h1>
        <p>Dashboard Financiero Personal</p>
    </header>

    <!-- Menú de Navegación -->
    <nav class="nav-menu">
        <a href="index.html" class="nav-btn active" >📊 Dashboard Mes</a>
        <a href="historial.html" class="nav-btn">📜 Historial</a>
        <a href="ahorros.html" class="nav-btn">🎯 Ahorros</a>
    </nav>
    
    <main class="container">
        
        <!-- Selector de Mes y Año -->
            <section class="month-selector-container" style="margin-bottom: 20px; text-align: center;">
                <label for="month-picker" style="color: #94a3b8; font-weight: 500; margin-right: 8px;">📅 Ver Mes:</label>
                <input type="month" id="month-picker" style="background: #1e293b; color: #fff; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; font-size: 1rem; font-family: inherit; color-scheme: dark;">
            </section>
        
        <!-- Métricas Principales -->
        <section class="cards">
            
            <div class="card full-width balance">
                <h3>💳 Dinero Total Disponible sin Ahorro</h3>
                <p id="total-balance">$0</p>
            </div>
            
            <div class="card income">
                <h3>📈 Ingresos Mes</h3>
                <p id="monthly-income">$0</p>
            </div>

            <div class="card expense">
                <h3>💸 Gastos Mes</h3>
                <p id="monthly-expense">$0</p>
            </div>

            <div class="card savings">
                <h3>🐷 Ahorros Total</h3>
                <p id="monthly-savings">$0</p>
            </div>

            <!-- Nueva tarjeta para completar la simetría 2x2 -->
            <div class="card net-month">
                <h3>📊 Balance del Mes</h3>
                <p id="monthly-net">$0</p>
            </div>

        </section>
        
        
        <!-- Saldos por Cuenta -->
        <section class="accounts-section">
            <h2 class="section-title">Mis Cuentas y Efectivo</h2>
            <div class="account-list" id="accounts-container">
                <!-- Se inyecta dinámicamente desde JS -->
            </div>
        </section>

        <!-- Lista de Movimientos -->
        <section class="transactions">
            <h2 class="section-title">Últimos Movimientos</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Monto</th>
                            <th>Cuenta</th>
                            <th>Categoría</th>
                            <th>Tipo</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-table"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
