<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Financial OS - Ahorros</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>💰 Financial OS</h1>
        <p>Centro de Ahorros y Metas</p>
    </header>

    <!-- Menú de Navegación -->
    <nav class="nav-menu">
        <a href="index.html" class="nav-btn">📊 Dashboard Mes</a>
        <a href="historial.html" class="nav-btn">📜 Historial</a>
        <a href="ahorros.html" class="nav-btn active">🎯 Ahorros</a>
    </nav>

    <main class="container">

        <!-- Tarjeta de Ahorro Acumulado -->
        <section class="cards">
            <div class="card full-width savings-card">
                <h3>🐷 Total Ahorrado Acumulado</h3>
                <p id="total-savings">$0</p>
            </div>
        </section>

        <!-- Historial de Aportaciones a Ahorro -->
        <section class="transactions">
            <h2 class="section-title">Registro de Ahorros</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Monto</th>
                            <th>Cuenta</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody id="savings-table"></tbody>
                </table>
            </div>
        </section>

    </main>

    <script src="js/ahorros.js"></script>

</body>

</html>
